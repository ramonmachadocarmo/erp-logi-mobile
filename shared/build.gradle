plugins {
    id 'com.android.library'
}
android {
    namespace 'com.example.myapplication.shared'
    compileSdk 37

    defaultConfig {
        minSdk 29
        targetSdk 37

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // URL do gateway em build de release: ./gradlew ... -PapiBaseUrl=https://erp.personalia.cloud
        // (o CI passa a variavel API_BASE_URL do GitHub). Vazio = ApiConfig cai no padrao emulador/LAN.
        buildConfigField "String", "API_BASE_URL", "\"${project.findProperty('apiBaseUrl') ?: ''}\""
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation libs.androidx.app
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.okhttp
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.work.runtime.ktx
    testImplementation 'junit:junit:4.13.2'
    testImplementation libs.okhttp.mockwebserver
    testImplementation libs.kotlinx.coroutines.test
    // org.json.JSONObject is a stub in the Android unit-test classpath (throws RuntimeException
    // for real bodies) — the standalone reference impl gives tests the real parsing behavior.
    testImplementation libs.org.json
}
