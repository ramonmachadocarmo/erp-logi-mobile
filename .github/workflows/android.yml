name: Android

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

# Um run por ref: um push novo no mesmo PR cancela o anterior; runs de tag/deploy nunca se cancelam.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # applicationId do :mobile (build.gradle.kts) — o mesmo cadastrado no Play Console.
  PACKAGE_NAME: com.ramonmachadocarmo.logi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Garante o bit de execucao independente do que estiver rastreado no Git — em Windows com
      # core.fileMode=false (comum), o gradlew pode ser commitado sem +x mesmo estando executavel
      # no disco local, e o checkout no Linux ai falha com "Permission denied" (exit 126).
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25          # mesmo da toolchain do projeto (gradle-daemon-jvm.properties)
      # Sem android-actions/setup-android: o runner ubuntu-latest ja vem com um SDK Android
      # instalado (ANDROID_HOME) e licencas aceitas — o AGP baixa sozinho qualquer platform/
      # build-tools que faltar durante o build. A action tentava reinstalar o pacote legado
      # "tools" (removido pelo Google ha anos) e quebrava com "Failed to find package 'tools'".
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitarios + build debug
        run: ./gradlew test assembleDebug

  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: play-store        # no GitHub: pode exigir aprovacao manual antes de publicar
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew

      - name: Conferir tag x version.properties e API_BASE_URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          NAME="$(sed -n -E 's/^VERSION_NAME=(.*)$/\1/p' version.properties | tr -d '\r')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} nao bate com VERSION_NAME=${NAME} do version.properties (use make logi-release)"; exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::variavel API_BASE_URL do GitHub precisa existir e ser https:// (recebido: '${API_BASE_URL}')"; exit 1 ;;
          esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build do app bundle (:mobile, release assinado)
        run: ./gradlew :mobile:bundleRelease -PapiBaseUrl=${{ vars.API_BASE_URL }}

      # `track` (singular) e' um input depreciado da action — o log ja mostrou o aviso pra migrar.
      # Ficou nesse caminho de codigo mais velho quando o "Committing the Edit" falhou com "The
      # service is currently unavailable" mesmo apos o Google ja ter aplicado a mudanca de verdade
      # (visivel no Play Console) — nao confirmado como a causa, mas e' o unico sinal concreto que
      # apareceu no log, e `tracks` (plural) e' o caminho recomendado hoje pela action.
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: mobile/build/outputs/bundle/release/mobile-release.aab
          tracks: ${{ inputs.track || 'internal' }}
          status: completed
